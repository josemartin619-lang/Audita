<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Audita</title>
<style>
  @font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/inter-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/inter-latin-500-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/inter-latin-600-normal.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/space-grotesk-latin-500-normal.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/space-grotesk-latin-600-normal.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/space-grotesk-latin-700-normal.woff2') format('woff2');}
  @font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');}
  @font-face{font-family:'Cairo';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/cairo-arabic-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Cairo';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/cairo-arabic-600-normal.woff2') format('woff2');}
  :root{
    --bg:#f2f2ee; --panel:#fbfbf8; --ink:#181a1f; --umber:#5c5f66; --faint:#9a9ba1;
    --green:#12855a; --green-soft:#1eb668; --rust:#c0392b; --ochre:#bd8420;
    --line:#e2e2da; --line2:#ecebe4; --side:#161d19; --side-ink:#e8ede9; --side-faint:#8a978f;
    --disp:'Space Grotesk','Inter',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --radius:13px;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:14px;line-height:1.5;background:var(--bg);-webkit-font-smoothing:antialiased;}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
  a{color:var(--green);text-decoration:none;} button{font-family:inherit;}

  /* ---------- Login ---------- */
  #login{display:none;max-width:380px;margin:14vh auto 0;padding:0 20px;}
  #login.on{display:block;}
  .brand-lg{font-family:var(--disp);font-weight:700;font-size:38px;letter-spacing:-.03em;text-align:center;}
  .brand-lg em{color:var(--green);font-style:normal;}
  .sub{font-family:var(--mono);text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--faint);text-align:center;margin:8px 0 26px;}
  #login input{width:100%;font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px;}
  #login input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(18,133,90,.14);}
  .btn{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid var(--green);background:var(--green);color:#fff;transition:background .12s;}
  .btn:hover{background:#0e6e49;}
  .btn.ghost{background:none;border-color:var(--line);color:var(--ink);}
  .btn.ghost:hover{border-color:var(--ink);}
  .sidebar .btn.ghost{color:var(--side-ink);border-color:rgba(255,255,255,.2);}
  .sidebar .btn.ghost:hover{border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.05);}
  .btn.sm{padding:7px 13px;font-size:10px;}
  .quick{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .quick button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:13px;}
  .quick button:hover{border-color:var(--green);}
  .quick .r{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
  .err{color:var(--rust);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;min-height:16px;margin-top:8px;}

  /* ---------- App shell ---------- */
  #app{display:none;} #app.on{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
  .sidebar{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sb-brand{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:-.02em;color:#fff;padding:4px 10px 14px;}
  .sb-brand em{color:var(--green-soft);font-style:normal;}
  .sb-client{margin:0 6px 12px;padding:10px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;cursor:pointer;}
  .sb-client .lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-faint);}
  .sb-client .nm{font-family:var(--disp);font-weight:500;font-size:14px;margin-top:3px;color:#fff;}
  .sb-sec{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-faint);padding:14px 12px 6px;}
  .nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--side-ink);font-size:13.5px;transition:background .1s;}
  .nav:hover{background:rgba(255,255,255,.06);}
  .nav.on{background:var(--green);color:#fff;}
  .nav .ic{width:16px;text-align:center;font-size:14px;opacity:.9;}
  .sb-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:8px;}
  .sb-user{font-size:12px;color:var(--side-faint);padding:0 4px;}
  .sb-user b{color:#fff;font-weight:500;font-family:var(--disp);display:block;font-size:13px;}
  .langtog{display:inline-flex;background:rgba(255,255,255,.07);border-radius:8px;padding:2px;width:fit-content;}
  .langtog button{background:none;border:0;color:var(--side-faint);font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:4px 10px;border-radius:6px;cursor:pointer;}
  .langtog button.on{background:var(--green);color:#fff;}

  .workspace{min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 34px 0;gap:14px;flex-wrap:wrap;}
  .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);}
  h1.page{font-family:var(--disp);font-weight:600;font-size:30px;letter-spacing:-.03em;margin:2px 0 0;}
  .content{padding:22px 34px 90px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .spacer{flex:1;}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:8px 0 22px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .kpi .k{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);}
  .kpi .v{font-family:var(--disp);font-weight:600;font-size:26px;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;}
  .kpi .v.pos{color:var(--green);} .kpi .v.neg{color:var(--rust);}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
  .panel .cap{display:flex;align-items:center;gap:12px;padding:15px 20px 13px;border-bottom:1px solid var(--line2);font-family:var(--disp);font-weight:600;font-size:15.5px;}
  .cap .note{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 20px;border-bottom:1px solid var(--line2);font-size:13.5px;}
  tbody tr:last-child td{border-bottom:0;}
  th{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:500;}
  th.num,td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;}
  tbody.click tr{cursor:pointer;} tbody.click tr:hover{background:#f4f4ee;}
  .fin td:first-child{color:var(--umber);} .fin tr.tot td{font-weight:600;border-top:1.5px solid var(--ink);}
  .pill{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;border:1px solid currentColor;border-radius:999px;padding:2px 9px;display:inline-block;}
  .pill.hi,.pill.high{color:var(--rust);} .pill.med,.pill.medium{color:var(--ochre);} .pill.lo,.pill.low,.pill.ok{color:var(--green);}
  .muted{color:var(--faint);} .empty{padding:34px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:12px 20px;border-radius:999px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.on{opacity:1;}

  .form{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 20px;}
  .form .full{grid-column:1/-1;}
  .field label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--umber);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(18,133,90,.12);}
  .linerow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:7px;align-items:center;}
  .linerow input,.linerow select{padding:7px 9px;font-size:13px;border:1px solid var(--line);border-radius:7px;}
  .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:16px;}
  .ccard{border:1px solid var(--line);border-radius:11px;padding:16px 12px;text-align:center;cursor:pointer;background:#fff;transition:all .12s;}
  .ccard:hover{border-color:var(--green);}
  .ccard.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(18,133,90,.16);}
  .tin{width:64px;text-align:right;font-family:var(--mono);font-size:13px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;}
  .tin:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(18,133,90,.12);}
  .tin:disabled{background:var(--panel);color:var(--faint);cursor:not-allowed;}
  .fin tr.drill{cursor:pointer;transition:background .1s;}
  .fin tr.drill:hover{background:rgba(18,133,90,.06);}
  .fin tr.drill td:first-child{position:relative;}
  .fin tr.drill td:first-child::after{content:'→';position:absolute;margin-left:9px;color:var(--green);opacity:0;transition:opacity .1s;font-family:var(--mono);}
  .fin tr.drill:hover td:first-child::after{opacity:.9;}
  .acttip{position:fixed;z-index:60;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .1s,transform .1s;
    background:var(--side);color:#fff;border-radius:10px;padding:11px 13px;min-width:210px;max-width:290px;
    box-shadow:0 12px 34px rgba(0,0,0,.28);font-size:12.5px;line-height:1.3;}
  .acttip.on{opacity:1;transform:translateY(0);}
  .acttip .tt-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:7px;}
  .acttip .tt-r{display:flex;justify-content:space-between;gap:16px;padding:2px 0;}
  .acttip .tt-r .nm{color:rgba(255,255,255,.86);}
  .acttip .tt-r .am{font-family:var(--mono);font-size:11.5px;white-space:nowrap;}
  .acttip .tt-r.tt-tot{border-top:1px solid rgba(255,255,255,.16);margin-top:6px;padding-top:6px;font-weight:600;}
  .acttip .tt-empty{color:rgba(255,255,255,.5);font-style:italic;}
  .acttip .tt-go{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--green);margin-top:8px;}

  /* ---------- Journal line grid (Dynamics-style, labelled columns) ---------- */
  .jgrid{width:100%;}
  .jhead,.jrow{display:grid;grid-template-columns:minmax(190px,2.4fr) 1fr 1fr 34px;gap:8px;align-items:center;}
  .jhead{padding:0 0 6px;}
  .jhead span{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--umber);}
  .jhead span.r{text-align:right;}
  .jrow{margin-bottom:7px;}
  .jrow input,.jrow select{width:100%;padding:8px 9px;font-size:13px;border:1px solid var(--line);border-radius:7px;background:#fff;font-family:inherit;}
  .jrow input.num{font-family:var(--mono);text-align:right;}
  .jrow input:focus,.jrow select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(18,133,90,.12);}
  .jrow .del{background:none;border:1px solid var(--line);color:var(--umber);cursor:pointer;font-size:15px;line-height:1;border-radius:7px;height:32px;}
  .jrow .del:hover{border-color:var(--rust);color:var(--rust);background:#fff;}
  .jtot{display:grid;grid-template-columns:minmax(190px,2.4fr) 1fr 1fr 34px;gap:8px;border-top:1.5px solid var(--ink);padding-top:9px;margin-top:4px;font-family:var(--mono);font-size:12.5px;}
  .jtot .lbl{text-transform:uppercase;letter-spacing:.1em;font-size:9.5px;color:var(--umber);align-self:center;}
  .jtot .v{text-align:right;font-variant-numeric:tabular-nums;}
  .jdiff{margin-top:9px;font-family:var(--mono);font-size:12px;}
  .jdiff.ok{color:var(--green);} .jdiff.bad{color:var(--rust);}

  /* ---------- Inline, persistent error banner (not a toast that vanishes) ---------- */
  .alert{display:none;margin:0 20px 4px;padding:11px 14px;border-radius:10px;font-size:13px;line-height:1.45;}
  .alert.on{display:block;}
  .alert.bad{background:#fdf0ee;border:1px solid #eabbb4;color:#8f2a1e;}
  .alert.good{background:#eef8f3;border:1px solid #bfe0d1;color:#0e6e49;}
  .alert b{font-family:var(--disp);}
  .hint{padding:10px 20px 0;color:var(--umber);font-size:12.5px;line-height:1.5;}
  .hint code{font-family:var(--mono);font-size:11.5px;background:#eeeee8;padding:1px 5px;border-radius:4px;}

  /* ---------- Tabs / report hub cards ---------- */
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px;}
  .tabs button{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:8px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--panel);color:var(--umber);cursor:pointer;}
  .tabs button:hover{border-color:var(--ink);color:var(--ink);}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .rulelist{padding:4px 20px 16px;}
  .rulelist h4{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--umber);margin:14px 0 6px;}
  .rulelist p{margin:0 0 5px;color:var(--ink);font-size:13px;line-height:1.5;padding-left:14px;position:relative;}
  .rulelist p::before{content:'—';position:absolute;left:0;color:var(--faint);}
  .rulelist p.warn{color:#8f5b0e;}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .scroll table{min-width:640px;}
  .mtop{margin-top:14px;}

  /* ---------- Mobile / small-laptop layout ----------
     The app shipped with exactly one media query, which is why the sidebar ate
     the screen on a phone and tables were cut off. Below 900px the sidebar
     becomes a horizontal strip, forms go single-column and tables scroll. */
  .sb-toggle{display:none;}
  @media(max-width:900px){
    #app.on,[dir="rtl"] #app.on{grid-template-columns:1fr;}
    .sidebar{position:static;height:auto;flex-direction:column;padding:12px 12px 10px;}
    [dir="rtl"] .sidebar{order:0;} [dir="rtl"] .workspace{order:1;}
    .sb-brand{padding:0 4px 8px;font-size:19px;}
    .sb-sec{display:none;}
    .sb-client{margin:0 0 10px;}
    #navMain{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;}
    #navMain .nav{flex:0 0 auto;padding:8px 12px;font-size:12.5px;white-space:nowrap;}
    .sb-foot{margin-top:10px;flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap;}
    .sb-user{flex:1;}
    .topbar{padding:16px 16px 0;}
    h1.page{font-size:23px;}
    .content{padding:16px 16px 70px;}
    .form{grid-template-columns:1fr;gap:12px;padding:16px;}
    .kpis{grid-template-columns:repeat(2,1fr);gap:10px;}
    .kpi .v{font-size:21px;}
    table{display:block;overflow-x:auto;white-space:nowrap;}
    th,td{padding:10px 13px;}
    .jhead{display:none;}
    .jrow,.jtot{grid-template-columns:1fr 1fr;gap:6px;}
    .jrow select{grid-column:1/-1;}
    .jrow .del{grid-column:1/-1;height:30px;}
    .jtot .lbl{grid-column:1/-1;}
    .panel{border-radius:11px;}
    .cap{flex-wrap:wrap;}
    .cap .note{margin-left:0;}
  }
  @media(max-width:560px){
    .kpis{grid-template-columns:1fr;}
    .ccard{padding:12px 8px;}
    .topbar .row{width:100%;}
  }

  /* ---------- RTL ---------- */
  [dir="rtl"] #app.on{grid-template-columns:1fr 236px;}
  [dir="rtl"] .sidebar{order:2;} [dir="rtl"] .workspace{order:1;}
  [dir="rtl"] body,[dir="rtl"] .nav,[dir="rtl"] td,[dir="rtl"] .field input,[dir="rtl"] .kpi{font-family:'Cairo','Inter',sans-serif;}
  [dir="rtl"] h1.page,[dir="rtl"] .cap,[dir="rtl"] .sb-brand,[dir="rtl"] .sb-client .nm,[dir="rtl"] .kpi .v,[dir="rtl"] .brand-lg{font-family:'Cairo','Space Grotesk',sans-serif;}
  [dir="rtl"] th,[dir="rtl"] td{text-align:right;} [dir="rtl"] th.num,[dir="rtl"] td.num{text-align:left;}
  [dir="rtl"] .num{text-align:left;}
  [dir="rtl"] .cap .note{margin-left:0;margin-right:auto;}
</style>
</head>
<body>
<div id="storageWarn" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:#7a2d12;color:#ffe9df;font:600 12px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:8px 16px;text-align:center;letter-spacing:.2px;box-shadow:0 1px 0 rgba(0,0,0,.25)"></div>
<div id="login">
  <div class="brand-lg">Audit<em>a</em></div>
  <div class="sub" data-t="tagline">Books that are born audited</div>
  <input id="lg_email" type="text" placeholder="you@firm.com" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"/>
  <input id="lg_pass" type="password" placeholder="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
  <button class="btn" style="width:100%" onclick="doLogin()" data-t="signin">Sign in</button>
  <div class="err" id="lg_err"></div>
  <div class="sub" style="margin:18px 0 6px" data-t="demo">Or sign in as a demo user</div>
  <div class="quick" id="quick"></div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="sb-brand">Audit<em>a</em></div>
    <div class="sb-client" id="clientBox" onclick="go('clients')"></div>
    <div class="sb-sec" data-t="secWork">Workspace</div>
    <div id="navMain"></div>
    <div class="sb-foot">
      <div class="langtog"><button id="lg-en" onclick="setLang('en')" class="on">EN</button><button id="lg-ar" onclick="setLang('ar')">ع</button></div>
      <div class="sb-user"><b id="uName"></b><span id="uRole"></span></div>
      <button class="btn ghost sm" onclick="logout()" data-t="signout">Sign out</button>
    </div>
  </aside>
  <main class="workspace">
    <div class="topbar"><div><div class="crumb" id="crumb"></div><h1 class="page" id="pageTitle"></h1></div><div class="row" id="pageActions"></div></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<div id="acctTip" class="acttip"></div>

<script>
let TOKEN=localStorage.getItem('aud_tok')||''; let USER=null; let LANG='en';
let CLIENTS=[]; let CUR=null; let PAGE='dashboard'; let ACCOUNTS=[]; let GCCMAP={}; let CURCUR={code:'SAR',decimals:2};
function money(n){const c=CURCUR||{code:'SAR',decimals:2};return c.code+' '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:c.decimals,maximumFractionDigits:c.decimals});}
function ccOf(id){return GCCMAP[id]||GCCMAP.SA||{flag:'🏳️',name:id,nameAr:id,currency:{code:'SAR',decimals:2},vatBps:1500,eInvoicing:{regime:'',status:''}};}

async function api(path,opts={}){
  const r=await fetch('/api'+path,{...opts,headers:{'content-type':'application/json',...(TOKEN?{authorization:'Bearer '+TOKEN}:{}),...(opts.headers||{})}});
  if(r.status===401){logout();throw new Error('Session expired');}
  if(!r.ok){let m='Error';try{m=(await r.json()).error||m;}catch{}throw new Error(m);}
  const ct=r.headers.get('content-type')||''; return ct.includes('json')?r.json():r.text();
}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200);}

async function viewDashboard(){
  const c=cur();setHead(c.name,title('dashboard'),'');
  const rep=await api(`/clients/${CUR}/reports`);const is=rep.incomeStatement,bs=rep.balanceSheet,tax=rep.taxPosition;
  // Per-account natural balances from the trial balance, keyed by code.
  const tbmap={};(rep.trialBalance.rows||[]).forEach(r=>tbmap[r.code]=r);
  const bal=a=>{const r=tbmap[a.code]||{debit:0,credit:0};return a.normal==='D'?r.debit-r.credit:r.credit-r.debit;};
  // Accounts of a chart type that actually carry a balance (skip empty ones).
  const of=types=>ACCOUNTS.filter(a=>types.includes(a.type)).map(a=>({name:LANG==='ar'&&a.nameAr?a.nameAr:a.name,amount:bal(a)})).filter(x=>Math.abs(x.amount)>0.0001);
  const neg=arr=>arr.map(x=>({name:x.name,amount:-x.amount}));
  // Equity carries current-year earnings that aren't a posted account; surface
  // the residual so the listed lines reconcile to the equity total.
  const eqItems=of(['equity']);const eqResid=bs.patrimonio-eqItems.reduce((s,x)=>s+x.amount,0);
  if(Math.abs(eqResid)>0.0001)eqItems.push({name:LANG==='ar'?'أرباح العام الحالي':'Current-year earnings',amount:eqResid});
  // key -> {tab, items[], total}
  DRILL={
    revenue:{tab:'invoices',items:of(['revenue']),total:is.ingresos},
    cogs:{tab:'bills',items:neg(of(['cogs'])),total:-is.costo},
    expenses:{tab:'bills',items:neg(of(['expense'])),total:-is.gastos},
    profit:{tab:'reports',items:[{name:'Revenue',amount:is.ingresos},{name:'Cost of sales',amount:-is.costo},{name:'Expenses',amount:-is.gastos}],total:is.utilidad},
    assets:{tab:'trialbalance',items:of(['asset']),total:bs.activos},
    liabilities:{tab:'trialbalance',items:of(['liability']),total:bs.pasivos},
    equity:{tab:'trialbalance',items:eqItems,total:bs.patrimonio},
  };
  const row=(k,label,val,tot)=>`<tr class="drill${tot?' tot':''}" data-drill="${k}" onmouseenter="tipShow(event,'${k}')" onmousemove="tipMove(event)" onmouseleave="tipHide()" onclick="tipGo('${k}')"><td>${label}</td><td class="num">${money(val)}</td></tr>`;
  $('view').innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="k">Revenue</div><div class="v">${money(is.ingresos)}</div></div>
      <div class="kpi"><div class="k">Profit</div><div class="v ${is.utilidad>=0?'pos':'neg'}">${money(is.utilidad)}</div></div>
      <div class="kpi"><div class="k">Assets</div><div class="v">${money(bs.activos)}</div></div>
      <div class="kpi"><div class="k">VAT payable</div><div class="v">${money(tax.ivaAPagar)}</div></div>
    </div>
    <div class="panel"><div class="cap">Financial position <span class="note">${rep.trialBalance.balanced?'trial balance ties · hover a line for detail, click to open':'OUT OF BALANCE'}</span></div>
      <table class="fin"><tbody>
        ${row('revenue','Revenue',is.ingresos)}
        ${row('cogs','Cost of sales',-is.costo)}
        ${row('expenses','Expenses',-is.gastos)}
        ${row('profit','Profit',is.utilidad,1)}
        ${row('assets','Assets',bs.activos)}
        ${row('liabilities','Liabilities',bs.pasivos)}
        ${row('equity','Equity',bs.patrimonio,1)}
      </tbody></table></div>`;
}
let DRILL={};
const TABLBL={invoices:'Invoices',bills:'Bills',reports:'Reports',trialbalance:'Trial balance',taxes:'Taxes',banking:'Banking',journal:'Journal',vendors:'Vendors'};
function tipShow(e,k){
  const d=DRILL[k];if(!d)return;const el=$('acctTip');
  const rows=d.items.length?d.items.map(i=>`<div class="tt-r"><span class="nm">${i.name}</span><span class="am">${money(i.amount)}</span></div>`).join('')
    :'<div class="tt-empty">No postings yet</div>';
  el.innerHTML=`<div class="tt-h">What's in this</div>${rows}<div class="tt-r tt-tot"><span class="nm">Total</span><span class="am">${money(d.total)}</span></div><div class="tt-go">Click → open ${TABLBL[d.tab]||d.tab}</div>`;
  el.classList.add('on');tipMove(e);
}
function tipMove(e){
  const el=$('acctTip');if(!el.classList.contains('on'))return;
  const pad=14,w=el.offsetWidth,h=el.offsetHeight;
  let x=e.clientX+pad,y=e.clientY+pad;
  if(x+w>innerWidth-8)x=e.clientX-w-pad;
  if(y+h>innerHeight-8)y=e.clientY-h-pad;
  el.style.left=Math.max(8,x)+'px';el.style.top=Math.max(8,y)+'px';
}
function tipHide(){$('acctTip').classList.remove('on');}
function tipGo(k){const d=DRILL[k];tipHide();if(d)go(d.tab);}

/* ---------------------------------------------------------------
   Journal entry — rebuilt as a labelled line grid
   ---------------------------------------------------------------
   The accountant's complaints were all about this one screen: "can't add
   credits", "can only add a line, not remove", "random errors", "counterparty
   should be a vendor dropdown", "invoice date and journal date should be
   separate". The credit column and the delete button existed but were
   unlabelled and nearly invisible — so the fix is a grid with headers, running
   column totals, a stated difference, and an error banner that stays put. */
let ELINES=[];
async function entryForm(){
  ELINES=[{a:'',d:'',c:''},{a:'',d:'',c:''}];
  await loadContacts();
  const vendors=CONTACTS.filter(x=>x.kind==='vendor'||x.kind==='both');
  const customers=CONTACTS.filter(x=>x.kind==='customer'||x.kind==='both');
  window._opts=ACCOUNTS.map(a=>`<option value="${a.code}">${a.code} · ${LANG==='ar'&&a.nameAr?a.nameAr:a.name}</option>`).join('');
  const grp=(lbl,list)=>list.length?`<optgroup label="${lbl}">${list.map(v=>`<option value="${esc(v.name)}">${esc(v.name)}${v.nit?' · '+esc(v.nit):''}</option>`).join('')}</optgroup>`:'';

        </div>

        <div class="row" style="margin-top:11px">
          <button class="btn ghost sm" onclick="addLine()">+ Add line</button>
          <button class="btn ghost sm" onclick="addLine(4)">+ 4 lines</button>

        </div>

function addLine(n){for(let i=0;i<(n||1);i++)ELINES.push({a:'',d:'',c:''});drawLines();}
/* One-click answer to "can only add debits, should be credit": takes whatever
   is sitting in the debit column on empty-credit lines and moves it across. */
function flipToCredit(){
  let moved=0;
  ELINES.forEach(l=>{if(l.d&&!l.c){l.c=l.d;l.d='';moved++;}});
  drawLines();
  if(moved)showOk('e_alert',`Moved ${moved} amount${moved>1?'s':''} from the debit column to the credit column.`);
}
function drawLines(){
  $('elines').innerHTML=ELINES.map((l,i)=>`<div class="jrow">
    <select onchange="ELINES[${i}].a=this.value"><option value="">Choose an account…</option>${window._opts}</select>
    <input class="num" type="number" step="0.01" inputmode="decimal" placeholder="Debit" value="${l.d}" oninput="setAmt(${i},'d',this.value)">
    <input class="num" type="number" step="0.01" inputmode="decimal" placeholder="Credit" value="${l.c}" oninput="setAmt(${i},'c',this.value)">
    <button class="del" title="Remove this line" onclick="removeLine(${i})">×</button></div>`).join('');
  ELINES.forEach((l,i)=>{const sel=$('elines').querySelectorAll('select')[i];if(sel)sel.value=l.a;});
  bal();
}
/* A line is a debit OR a credit, never both — the ledger rejects a line that
   carries both, so the form clears the other side instead of letting the user
   build an entry the server will refuse. */
function setAmt(i,side,val){
  ELINES[i][side]=val;
  if(val&&Number(val)!==0){
    const other=side==='d'?'c':'d';
    if(ELINES[i][other]){
      ELINES[i][other]='';
      const inputs=$('elines').querySelectorAll('.jrow')[i].querySelectorAll('input');
      inputs[other==='d'?0:1].value='';
    }
  }
  bal();
}
function removeLine(i){
  if(ELINES.length<=2){ELINES[i]={a:'',d:'',c:''};drawLines();
    return showErr('e_alert','A double entry needs at least two lines, so this one was cleared instead of deleted.');}
  ELINES.splice(i,1);drawLines();clearErr('e_alert');
}
function bal(){
  const d=ELINES.reduce((s,l)=>s+(Number(l.d)||0),0), c=ELINES.reduce((s,l)=>s+(Number(l.c)||0),0);
  if($('tot_d'))$('tot_d').textContent=money(d);
  if($('tot_c'))$('tot_c').textContent=money(c);
  const el=$('ebal');if(!el)return;
  const diff=d-c;
  if(d===0&&c===0){el.className='jdiff';el.textContent='Enter the debit and the credit side.';return;}
  if(diff===0){el.className='jdiff ok';el.textContent='✓ Balanced — debits equal credits.';return;}
  el.className='jdiff bad';
  el.textContent=diff>0
    ? `Out of balance by ${money(diff)} — you need ${money(diff)} more on the CREDIT side.`
    : `Out of balance by ${money(-diff)} — you need ${money(-diff)} more on the DEBIT side.`;
}
async function postEntry(){
  clearErr('e_alert');
  const used=ELINES.filter(l=>l.a&&(Number(l.d)||Number(l.c)));
  const named=ELINES.filter(l=>!l.a&&(Number(l.d)||Number(l.c)));
  if(named.length)return showErr('e_alert',`${named.length} line${named.length>1?'s have':' has'} an amount but no account. Pick an account or clear the amount.`);
  if(used.length<2)return showErr('e_alert','A double entry needs at least two lines — one debit and one credit.');
  const d=used.reduce((s,l)=>s+(Number(l.d)||0),0), c=used.reduce((s,l)=>s+(Number(l.c)||0),0);
  if(d!==c)return showErr('e_alert',`<b>Not balanced.</b> Debits total ${money(d)} and credits total ${money(c)} — a difference of ${money(Math.abs(d-c))}. Adjust a line before posting.`);
  if(!$('e_memo').value.trim())return showErr('e_alert','Add a description so the entry can be identified later.');
  const lines=used.map(l=>({accountCode:l.a,debit:Number(l.d)||undefined,credit:Number(l.c)||undefined}));
  const src=$('e_src')?$('e_src').value:'';
  try{
    await api(`/clients/${CUR}/entries`,{method:'POST',body:JSON.stringify({
      date:$('e_date').value, docDate:$('e_docdate').value||undefined,
      memo:$('e_memo').value, source:src, sourceDocument:$('e_doc').value||undefined, lines})});
    toast('Entry posted');go('journal');
  }catch(e){showErr('e_alert','<b>The ledger refused this entry.</b><br>'+esc(e.message));}
}

function readCsvFile(){
  const f=$('rcFile').files&&$('rcFile').files[0];if(!f)return;
  const rd=new FileReader();
  rd.onerror=()=>showErr('b_alert','That file could not be read.');
  rd.onload=()=>{
    const rows=String(rd.result||'').replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());
    // A header row has no digits in its last column — drop it rather than
    // reporting it as an unmatched deposit of zero.
    if(rows.length&&!/\d/.test((rows[0].split(',').pop()||'')))rows.shift();
    $('rc').value=rows.join('\n');
    showOk('b_alert',`Loaded <b>${rows.length}</b> line${rows.length===1?'':'s'} from ${esc(f.name)}. Press <b>Reconcile</b>.`);
  };
  rd.readAsText(f);
}
async function loadSample(){
  try{
    const r=await api(`/clients/${CUR}/bank-statement-sample`);
    if(!r.length)return showErr('b_alert','Nothing has hit cash or bank yet, so there is no statement to build. Post an entry that touches account 1000 or 1010 first.');
    $('rc').value=r.map(l=>`${l.date},${l.description},${l.amount}`).join('\n');
    showOk('b_alert',`Built a <b>${r.length}</b>-line statement from every cash and bank movement in the ledger. Press <b>Reconcile</b> &mdash; all of it should match.`);
  }catch(e){showErr('b_alert',esc(e.message));}
}
async function runRecon(){
  const txt=($('rc').value||'').trim();
  if(!txt)return showErr('b_alert','Paste a statement, upload a CSV, or press <b>Build statement from ledger</b> first.');
  try{
    const r=await api(`/clients/${CUR}/reconcile`,{method:'POST',body:JSON.stringify({csv:txt})});
    clearErr('b_alert');
    const pct=r.statementCount?Math.round(r.matchedCount/r.statementCount*100):0;
    $('rcOut').innerHTML=`${r.matchedCount} of ${r.statementCount} statement lines matched (${pct}%)`;
    const money2=n=>money(n);
    const sTbl=(rows,cols,body)=>`<div class="scroll"><table><thead><tr>${cols}</tr></thead><tbody>${body||`<tr><td colspan="6" class="muted" style="padding:18px 0">Nothing here.</td></tr>`}</tbody></table></div>`;
    $('rcRes').innerHTML=`
      <div class="panel"><div class="cap">Matched <span class="note">${r.matches.length} line${r.matches.length===1?'':'s'}</span></div>
        <div class="hint">Same date, same amount, and a description the ledger memo recognises. Nothing to do with these.</div>
        ${sTbl(null,`<th>Date</th><th>Statement description</th><th class="num">Amount</th><th>Entry</th><th>Ledger memo</th>`,
          r.matches.map(m=>`<tr><td class="mono" style="font-size:11.5px">${esc(m.date)}</td><td>${esc(m.description)}</td>
            <td class="num">${money2(m.amount)}</td><td class="mono" style="font-size:11px">${esc(m.entryId)}</td><td class="muted">${esc(m.entryMemo)}</td></tr>`).join(''))}</div>
      <div class="panel"><div class="cap" style="color:var(--rust)">On the statement, not in the ledger <span class="note">${r.unmatchedStatement.length}</span></div>
        <div class="hint">The bank moved money we have not booked. Each of these needs a journal entry &mdash; or the amount, date or memo is wrong on the entry we did book.</div>
        ${sTbl(null,`<th>Date</th><th>Description</th><th class="num">Amount</th><th class="num"></th>`,
          r.unmatchedStatement.map(u=>`<tr><td class="mono" style="font-size:11.5px">${esc(u.date)}</td><td>${esc(u.description)}</td>
            <td class="num">${money2(u.amount)}</td><td class="num"><button class="btn ghost sm" onclick="go('journal')">Book it &rarr;</button></td></tr>`).join(''))}</div>
      <div class="panel"><div class="cap" style="color:var(--ochre)">In the ledger, not on the statement <span class="note">${r.unmatchedLedger.length}</span></div>
        <div class="hint">We booked cash movement the bank has not shown. Normal for a cheque in transit or a deposit at month end; suspicious for anything older than that.</div>
        ${sTbl(null,`<th>Date</th><th>Entry</th><th>Memo</th><th class="num">Cash movement</th>`,
          r.unmatchedLedger.map(u=>`<tr><td class="mono" style="font-size:11.5px">${esc(u.date)}</td><td class="mono" style="font-size:11px">${esc(u.entryId)}</td>
            <td>${esc(u.memo)}</td><td class="num">${money2(u.delta)}</td></tr>`).join(''))}</div>`;
  }catch(e){showErr('b_alert','<b>Reconciliation failed.</b><br>'+esc(e.message));}
}

    <div class="hint">Rates are <b>implied</b> &mdash; VAT divided by net base on each entry, not the rate someone typed. A band you did not expect is the fastest way to find a mis-posted invoice.</div>
    <div class="scroll"><table><thead><tr><th>Side</th><th class="num">Rate</th><th class="num">Entries</th><th class="num">Net base</th><th class="num">VAT</th></tr></thead>
    <tbody>${r.bands.length?r.bands.map(b=>`<tr><td>${b.side==='sale'?'Sales':'Purchases'}</td>
      <td class="num mono">${pct(b.rateBps)}</td><td class="num">${b.count}</td><td class="num">${money(b.base)}</td><td class="num">${money(b.vat)}</td></tr>`).join('')
      :`<tr><td colspan="5" class="muted" style="padding:18px 0">Nothing in this period.</td></tr>`}</tbody></table></div></div>
  ${r.unexplained.length?`<div class="panel"><div class="cap" style="color:var(--rust)">VAT with no identifiable base <span class="note">${r.unexplained.length}</span></div>
    <div class="hint">These entries move a VAT account but nothing that looks like a taxable base, so no rate can be checked. They are still counted in the totals above &mdash; a VAT return that quietly dropped them would be wrong. Review each one.</div>
    <div class="scroll"><table><thead><tr><th>Date</th><th>Entry</th><th>Memo</th><th>Side</th><th class="num">VAT</th></tr></thead>
    <tbody>${r.unexplained.map(u=>`<tr><td class="mono" style="font-size:11.5px">${esc(u.date)}</td><td class="mono" style="font-size:11px">${esc(u.entryId)}</td>
      <td>${esc(u.memo)}</td><td>${u.side}</td><td class="num">${money(u.vat)}</td></tr>`).join('')}</tbody></table></div></div>`:''}`;
}
function schedHtml(r){
  const tbl=(ttl,rows,note)=>`<div class="panel"><div class="cap">${ttl} <span class="note">${rows.length} line${rows.length===1?'':'s'}</span></div>
    <div class="hint">${note}</div>
    <div class="scroll"><table><thead><tr><th>Posted</th><th>Doc. date</th><th>Doc. no.</th><th>Counterparty</th><th>Description</th><th class="num">Net</th><th class="num">VAT</th><th class="num">Rate</th><th>Treatment</th></tr></thead>
    <tbody>${rows.length?rows.map(l=>`<tr ${l.reversed?'style="opacity:.45"':''}>
      <td class="mono" style="font-size:11.5px">${esc(l.date)}</td><td class="mono" style="font-size:11.5px">${esc(l.docDate||'')}</td>
      <td class="mono" style="font-size:11.5px">${esc(l.docNumber||'')}</td><td>${esc(l.counterparty)}</td><td class="muted">${esc(l.memo)}</td>
      <td class="num">${money(l.base)}</td><td class="num">${money(l.vat)}</td>
      <td class="num mono">${l.rateBps===null?'—':pct(l.rateBps)}</td>
      <td class="mono" style="font-size:10.5px">${l.treatment==='standard'?'standard':'zero-rated / exempt'}</td></tr>`).join('')
      :`<tr><td colspan="9" class="muted" style="padding:18px 0">Nothing in this period.</td></tr>`}</tbody></table></div></div>`;
  return `<div class="panel"><div class="cap">Period</div>${periodHtml()}
    <div class="hint">Every line below is derived from the ledger, not from the invoice table &mdash; so a manual journal entry that touched a VAT account appears here too. Export both schedules with the button in the header.</div></div>
    ${tbl('Sales',r.sales,'All sales with VAT and all sales without it. A sale showing revenue but no output VAT is reported as zero-rated or exempt &mdash; which of the two it is depends on the supply, and only the preparer can say.')}
    ${tbl('Purchases',r.purchases,'Expenses, cost of sales and capitalised purchases that carried recoverable input VAT.')}`;
}
function rulesHtml(t){
  const R=t.rules, c=t.country;
  const list=(ttl,arr,cls)=>arr&&arr.length?`<h4>${ttl}</h4>`+arr.map(x=>`<p class="${cls||''}">${esc(x)}</p>`).join(''):'';
  return `<div class="panel"><div class="cap">${c.flag} ${esc(c.name)} &mdash; VAT rules <span class="note">${R.inForce?'VAT in force':'no VAT regime'}</span></div>
    <div class="hint"><b>This is a preparer's reference, not tax advice.</b> Every heading below is a well-established category from the authority's own guidance, but the wording is summarised. Check the position against the source before you file: <a href="${esc(R.authorityUrl)}" target="_blank" rel="noopener">${esc(R.authority)}</a>.</div>
    <table class="fin"><tbody>
      <tr><td>Standard rate</td><td class="num mono">${pct(R.standardBps)}</td></tr>
      <tr><td>Corporate income tax</td><td class="num mono">${c.corpTaxPct==null?'—':c.corpTaxPct+'%'}</td></tr>
      <tr><td>Zakat</td><td class="num mono">${c.zakatPct==null?'—':c.zakatPct+'%'}</td></tr>
      <tr><td>Mandatory registration</td><td class="num">${esc(R.registrationThreshold)}</td></tr>
      <tr><td>Voluntary registration</td><td class="num">${esc(R.voluntaryThreshold||'—')}</td></tr>
      <tr><td>Filing frequency</td><td class="num">${esc(R.filing)}</td></tr>
      <tr><td>E-invoicing regime</td><td class="num">${esc(c.eInvoicing.regime)}</td></tr>
    </tbody></table>
    <div class="rulelist">
      ${list('Zero-rated — 0%, input VAT still recoverable',R.zeroRated)}
      ${list('Exempt — no VAT, and input VAT NOT recoverable',R.exempt)}
      ${list('Out of scope',R.outOfScope)}
      ${list('Reverse charge — the buyer self-accounts',R.reverseCharge)}
      ${list('Exceptions that catch preparers out',R.exceptions,'warn')}
    </div></div>
  <div class="panel"><div class="cap">Treatment catalogue <span class="note">what to pick when you post</span></div>
    <div class="hint">These are the treatment codes the bill and invoice forms offer. The difference between exempt and zero-rated is the one that costs money: both charge no VAT on the sale, but only zero-rating lets you keep the input VAT.</div>
    <div class="scroll"><table><thead><tr><th>Code</th><th>Name</th><th class="num">Rate</th><th>Input VAT</th><th>Reporting</th></tr></thead>
    <tbody>${(t.treatments||[]).map(x=>`<tr><td class="mono" style="font-size:11px">${esc(x.code)}</td><td><b style="font-family:var(--disp)">${esc(x.name)}</b>
      <div class="muted" style="font-size:12px;line-height:1.45">${esc(x.explain||'')}</div></td>
      <td class="num mono">${x.rateBps==null?'local rate':pct(x.rateBps)}</td>
      <td>${x.inputRecoverable?'recoverable':'<span style="color:var(--rust)">not recoverable</span>'}</td>
      <td class="muted" style="font-size:12px">${x.reportable?'on the return':'not on the return'}${x.buyerAccounts?' · buyer accounts for the VAT':''}</td></tr>`).join('')}</tbody></table></div></div>`;
}

/* Say out loud when this instance cannot keep data. An accountant must never
   discover after the fact that the ledger they posted into was a scratchpad.
   /health is public, so this works on the login screen too. */
function showStorageWarn(text,red){
  var el=$('storageWarn');
  if(!el)return;
  if(red)el.style.background='#8c1111';
  el.textContent=text;
  el.style.display='block';
  document.body.style.paddingTop='34px';
}
/**
 * Three outcomes matter here, and the broken one is the reason this exists:
 *  - /health answers durable:true   -> say nothing.
 *  - /health answers durable:false  -> demo banner, data will not survive.
 *  - /health does not answer at all -> the server could not start (almost always
 *    a configured-but-unreachable DATABASE_URL, or a missing JWT secret). The
 *    static page still loads from the CDN, so without this branch the user gets
 *    a normal-looking app whose every action fails. Say it out loud.
 */
async function checkStorage(){
  var r;
  try{ r=await fetch('/health'); }
  catch(e){
    showStorageWarn('SERVER UNREACHABLE — the app cannot talk to its backend, so nothing here works. Reload, and if this persists the deployment is down.',true);
    return;
  }
  var h={};
  try{ h=await r.json(); }catch(e){}
  if(!r.ok||h.ok===false){
    showStorageWarn('SERVER NOT STARTED — '+(h.detail||h.error||('HTTP '+r.status))+'. Nothing you do will be saved. This is a deployment configuration problem, not your data.',true);
    return;
  }
  if(h.durable===false){
    if(h.storage==='unavailable'){
      showStorageWarn('STORAGE UNREACHABLE — a database is configured but cannot be reached, so nothing you enter will be saved. Do not use this instance until it is fixed.',true);
    }else{
      showStorageWarn('DEMO MODE — data is not saved. Anything you post here disappears when this instance restarts. Set DATABASE_URL to enable durable storage.',false);
    }
  }
}
(async function(){renderQuick();checkStorage();
  if(TOKEN){try{await boot();return;}catch(e){}}
  $('login').classList.add('on');
})();
