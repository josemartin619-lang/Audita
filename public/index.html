<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Audita</title>
<style>
  /* Local fonts, no CDN. Display: Space Grotesk · Text: Inter · Figures/labels: JetBrains Mono · Arabic: Cairo */
  @font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/inter-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/inter-latin-500-normal.woff2') format('woff2');}
  @font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/inter-latin-600-normal.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/space-grotesk-latin-500-normal.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/space-grotesk-latin-600-normal.woff2') format('woff2');}
  @font-face{font-family:'Space Grotesk';font-weight:700;font-style:normal;font-display:swap;src:url('/fonts/space-grotesk-latin-700-normal.woff2') format('woff2');}
  @font-face{font-family:'JetBrains Mono';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2');}
  @font-face{font-family:'JetBrains Mono';font-weight:500;font-style:normal;font-display:swap;src:url('/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');}
  @font-face{font-family:'Cairo';font-weight:400;font-style:normal;font-display:swap;src:url('/fonts/cairo-arabic-400-normal.woff2') format('woff2');}
  @font-face{font-family:'Cairo';font-weight:600;font-style:normal;font-display:swap;src:url('/fonts/cairo-arabic-600-normal.woff2') format('woff2');}

  :root{
    --bg:#f2f2ee; --ink:#181a1f; --umber:#5c5f66; --faint:#9a9ba1;
    --gold:#12855a; --gold-soft:#1eb668;        /* accent green (deep) + positive green (bright) */
    --cerulean:#3f6076;
    --rust:#c0392b; --ochre:#bd8420; --olive:#12855a;
    --line:#e2e2da; --line2:#ececE4;
    --parch:#fbfbf8; --parch2:#fbfbf8;
    --shadow:0 1px 2px rgba(20,18,12,.03), 0 20px 44px -28px rgba(20,18,12,.20);
    --radius:15px;
    --disp:'Space Grotesk','Inter',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink); font-size:14px; line-height:1.5; letter-spacing:-.006em;
    min-height:100vh; background:var(--bg);
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  .stage{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:34px 32px 120px;}
  .clock{display:none;}
  .num,td.num,th.num,.score,.ref,.emono,.cufe,.verifybox,.cid,.note{font-family:var(--mono); font-variant-numeric:tabular-nums;}

  /* ---- Masthead ---- */
  .mast{display:flex; align-items:center; justify-content:space-between; padding:2px 0 24px; border-bottom:1px solid var(--line); position:relative;}
  .word{font-family:var(--disp); font-weight:700; font-size:27px; letter-spacing:-.03em; line-height:1; color:var(--ink);}
  .word em{font-style:normal; color:var(--gold);}
  .tag{font-family:var(--mono); font-weight:400; color:var(--faint); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; margin-top:9px;}
  .lang{display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:999px; padding:2px; background:var(--parch);}
  .lang button{background:none; border:0; cursor:pointer; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:5px 13px; font-weight:600; border-radius:999px; font-family:var(--mono); line-height:1.4;}
  .lang button.on{color:var(--parch); background:var(--ink);}
  .lang .sep{display:none;}
  .mastright{display:flex; flex-direction:column; align-items:flex-end; gap:11px;}
  .userchip{display:flex; align-items:center; gap:11px; font-size:12.5px; color:var(--umber);}
  .userchip .who{font-family:var(--disp); font-weight:500; font-size:13.5px; color:var(--ink);}
  .userchip .role{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); background:none; border:1px solid var(--gold); padding:2px 8px; border-radius:999px; font-weight:500;}
  .userchip a{font-family:var(--mono); color:var(--faint); cursor:pointer; text-decoration:none; font-size:10px; letter-spacing:.14em; text-transform:uppercase;}
  .userchip a:hover{color:var(--rust);}

  /* ---- Login ---- */
  .login{max-width:400px; margin:13vh auto 0;}
  .login .word2{font-family:var(--disp); font-weight:700; font-size:40px; letter-spacing:-.03em; text-align:center; color:var(--ink);}
  .login .word2 em{color:var(--gold); font-style:normal;}
  .login .sub2{font-family:var(--mono); color:var(--faint); text-align:center; margin:10px 0 30px; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;}
  .login input{width:100%; font-family:inherit; font-size:15px; padding:12px 14px; border:1px solid var(--line); border-radius:11px; background:var(--parch); color:var(--ink); margin-bottom:10px;}
  .login input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(18,133,90,.14);}
  .quick{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .quick button{display:flex; align-items:center; justify-content:space-between; border:1px solid var(--line); background:var(--parch); border-radius:11px; padding:13px 15px; cursor:pointer; font-family:inherit; font-size:14px; color:var(--ink);}
  .quick button:hover{border-color:var(--gold);}
  .quick .r{font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:500;}
  .loginerr{color:var(--rust); font-family:var(--mono); font-size:11px; letter-spacing:.06em; margin-top:12px; min-height:18px; text-transform:uppercase;}

  /* view title — the big confident statement */
  h2.section{font-family:var(--disp); font-weight:600; font-size:34px; letter-spacing:-.03em; line-height:1.04; margin:38px 0 8px; color:var(--ink);}
  .lead{font-family:var(--mono); color:var(--faint); margin:0 0 30px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; line-height:1.7;}

  /* ---- Panels: numbered, editorial, light ---- */
  #view{counter-reset:panelnum;}
  .panel{counter-increment:panelnum; background:var(--parch); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:22px; overflow:hidden;}
  .panel .cap{padding:17px 24px 15px; border-bottom:1px solid var(--line2); font-family:var(--disp); font-weight:600; font-size:18px; letter-spacing:-.02em; color:var(--ink); display:flex; align-items:center; justify-content:flex-start; gap:13px;}
  .panel .cap::before{content:counter(panelnum,decimal-leading-zero); font-family:var(--mono); font-weight:500; font-size:12px; letter-spacing:.02em; color:var(--gold); align-self:center;}
  .cap .note{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-weight:400; margin-left:auto;}

  table{width:100%; border-collapse:collapse;}
  th,td{text-align:left; padding:13px 24px; border-bottom:1px solid var(--line2);}
  tbody tr:last-child td{border-bottom:0;}
  th{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:500;}
  td{font-size:14px; color:var(--ink);}
  td.num,th.num{text-align:right; font-size:13px;}
  tbody.rows tr{cursor:pointer; transition:background .12s;}
  tbody.rows tr:hover{background:#f4f4ee;}
  .cname{font-family:var(--disp); font-weight:600; font-size:16px; letter-spacing:-.01em; color:var(--ink);}
  .cid{font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-top:3px;}

  .risk{display:flex; align-items:center; gap:14px;}
  .track{position:relative; width:120px; height:4px; background:#e4e4dc; border-radius:999px; overflow:hidden;}
  .track i{position:absolute; left:0; top:0; height:4px; border-radius:999px;}
  .track b{display:none;}
  .score{font-family:var(--disp); font-weight:600; font-size:22px; min-width:34px; color:var(--ink); letter-spacing:-.02em;}

  /* pill status — the atuin/cofactr signature */
  .band{font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:500; border:1px solid currentColor; border-radius:999px; padding:3px 10px;}
  .band.alto,.band.high{color:var(--rust);}
  .band.medio,.band.medium{color:var(--ochre);}
  .band.bajo,.band.low{color:var(--gold);}
  .drivers{margin:9px 0 0; padding:0; list-style:none;}
  .drivers li{font-family:var(--mono); font-size:10.5px; letter-spacing:.02em; color:var(--umber); text-transform:uppercase; line-height:1.7;}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  .fin td:first-child{color:var(--umber);}
  .fin tr.tot td{font-weight:600; color:var(--ink); border-top:1.5px solid var(--ink);}
  .stamp{padding:15px 24px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); border-top:1px solid var(--line2);}
  .valid{color:var(--gold); font-weight:500;} .broken{color:var(--rust); font-weight:500;}

  .sev{font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; font-weight:500; border:1px solid currentColor; border-radius:999px; padding:3px 9px; background:none;}
  .sev.high{color:var(--rust);} .sev.medium{color:var(--ochre);} .sev.low{color:var(--cerulean);}

  .status{font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--umber);}
  .ref{font-size:11px; color:var(--faint);}
  .msg{max-width:360px; color:var(--umber); font-size:13px; line-height:1.5;}

  .act{font-family:var(--mono); border:1px solid var(--line); background:var(--parch); color:var(--umber); border-radius:999px; padding:5px 12px; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-weight:500; margin-left:6px;}
  .act:hover{border-color:var(--gold); color:var(--gold);}
  .act.esc{color:var(--rust); border-color:rgba(192,57,43,.35);}
  .act.esc:hover{background:var(--rust); color:var(--parch); border-color:var(--rust);}

  .back{font-family:var(--mono); background:none; border:0; color:var(--umber); cursor:pointer; font-size:10px; letter-spacing:.12em; text-transform:uppercase; padding:0; margin:4px 0 22px;}
  .back:hover{color:var(--gold);}
  .foot{font-family:var(--mono); color:var(--faint); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-top:10px;}
  .none{padding:36px; text-align:center; color:var(--faint); font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;}

  /* toolbar — pills, one green primary, rest ghost */
  .toolbar{display:flex; gap:8px; align-items:center; margin:4px 0 26px; flex-wrap:wrap;}
  .btn{font-family:var(--mono); border:1px solid var(--gold); background:var(--gold); color:var(--parch); border-radius:999px; padding:9px 17px; font-size:10px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; font-weight:500; transition:all .12s;}
  .btn:hover{background:#0e6e49; border-color:#0e6e49;}
  .btn.ink{background:none; border-color:var(--line); color:var(--ink);}
  .btn.ink:hover{border-color:var(--ink); background:none;}

  /* modal */
  .scrim{position:fixed; inset:0; background:rgba(24,26,20,.4); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:50; padding:24px;}
  .scrim.on{display:flex;}
  .modal{background:var(--parch); border:1px solid var(--line); border-radius:18px; box-shadow:0 34px 90px -34px rgba(20,18,12,.44); width:620px; max-width:100%; max-height:90vh; overflow:auto;}
  .modal .mh{padding:20px 26px 16px; border-bottom:1px solid var(--line2); font-family:var(--disp); font-weight:600; font-size:21px; letter-spacing:-.02em; display:flex; align-items:center; justify-content:space-between;}
  .modal .mh .x{background:none; border:0; font-size:22px; color:var(--faint); cursor:pointer; line-height:1;}
  .modal .mb{padding:24px 26px;}
  .modal .mf{padding:16px 26px; border-top:1px solid var(--line2); display:flex; gap:10px; justify-content:flex-end;}
  .field{margin-bottom:15px;}
  .field label{font-family:var(--mono); display:block; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--umber); font-weight:500; margin-bottom:7px;}
  .field input,.field select{width:100%; font-family:inherit; font-size:14px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--parch); color:var(--ink);}
  .field input:focus,.field select:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(18,133,90,.14);}
  .two{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .lines{width:100%; border-collapse:collapse; margin-top:4px;}
  .lines th{padding:4px 6px; font-size:9px;}
  .lines td{padding:4px 6px; border:0;}
  .lines input,.lines select{width:100%; padding:7px 9px; font-size:13px; border:1px solid var(--line); border-radius:8px; background:var(--parch); font-family:inherit;}
  .addln{font-family:var(--mono); background:none; border:0; color:var(--gold); cursor:pointer; font-size:10px; letter-spacing:.1em; text-transform:uppercase; padding:8px 0;}
  .bal{display:flex; gap:18px; align-items:center; padding:11px 0 2px; font-size:13px;}
  .bal .ok{color:var(--gold); font-weight:600;} .bal .no{color:var(--rust); font-weight:600;}
  .cufe{background:#eef0ea; border:0; border-radius:10px; padding:13px 15px; font-size:11px; color:var(--umber); word-break:break-all; line-height:1.7;}
  .emono{font-size:11px; color:var(--faint);}
  .imm{margin-top:15px; padding:13px 15px; background:#eef0ea; border-radius:10px; font-family:var(--mono); font-size:11px; letter-spacing:.02em; color:var(--umber); line-height:1.7;}
  .toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:var(--ink); color:var(--parch); padding:13px 22px; border-radius:999px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; box-shadow:0 16px 40px -14px rgba(20,18,12,.5); z-index:80;}

  tr.trace{cursor:pointer;}
  tr.trace td:first-child{color:var(--gold);}
  tr.trace:hover{background:#f4f4ee;}
  .closebar{padding:13px 24px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; border-bottom:1px solid var(--line2);}
  .closebar.ok{color:var(--gold);} .closebar.no{color:var(--rust);}
  .verifybox{background:#eef0ea; border:0; border-radius:10px; padding:13px 15px; font-size:11px; color:var(--umber); word-break:break-all; margin-top:8px;}
  .checklist{padding:16px 24px; border-bottom:1px solid var(--line2);}
  .ckhead{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:12px;}
  .ckrow{display:flex; align-items:center; gap:12px; padding:8px 0; font-size:14px;}
  .ckrow.clk{cursor:pointer;} .ckrow.clk:hover .cklabel{color:var(--gold);}
  .ckmark{width:20px; height:20px; border:1.5px solid var(--line); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent;}
  .ckmark.on{background:var(--gold); border-color:var(--gold); color:var(--parch);}
  .autotag{font-family:var(--mono); font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); border:1px solid var(--line); border-radius:999px; padding:2px 8px;}
  .cby{font-family:var(--mono); color:var(--faint); font-size:10px; letter-spacing:.04em; text-transform:uppercase;}
  .tplrow{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line2);}
  .tplrow .nm{font-family:var(--disp); font-weight:500; font-size:14.5px;}
  @media(max-width:820px){.grid{grid-template-columns:1fr}.clock{display:none}.word{font-size:23px}.two{grid-template-columns:1fr}.stage{padding:26px 18px 90px}h2.section{font-size:27px}}

  /* ---- Arabic / RTL ---- */
  [dir="rtl"] body, [dir="rtl"] .msg, [dir="rtl"] td, [dir="rtl"] .ckrow, [dir="rtl"] .quick button, [dir="rtl"] input, [dir="rtl"] textarea, [dir="rtl"] select{
    font-family:'Cairo','Inter','Segoe UI',Tahoma,sans-serif;
  }
  [dir="rtl"] h2.section, [dir="rtl"] .panel .cap, [dir="rtl"] .cname, [dir="rtl"] .word2, [dir="rtl"] .tplrow .nm, [dir="rtl"] .modal .mh{
    font-family:'Cairo','Space Grotesk',sans-serif; font-weight:600; letter-spacing:0;
  }
  [dir="rtl"] .tag, [dir="rtl"] .lead, [dir="rtl"] .th, [dir="rtl"] th, [dir="rtl"] .cid, [dir="rtl"] .band, [dir="rtl"] .sev,
  [dir="rtl"] .note, [dir="rtl"] .role, [dir="rtl"] .autotag, [dir="rtl"] .userchip a, [dir="rtl"] .status, [dir="rtl"] .field label,
  [dir="rtl"] .drivers li, [dir="rtl"] .foot, [dir="rtl"] .back, [dir="rtl"] .none, [dir="rtl"] .ckhead, [dir="rtl"] .btn, [dir="rtl"] .act, [dir="rtl"] .sub2, [dir="rtl"] .cby, [dir="rtl"] .lang button{
    font-family:'Cairo',var(--mono); letter-spacing:0; text-transform:none;
  }
  [dir="rtl"] th, [dir="rtl"] td{text-align:right;}
  [dir="rtl"] td.num, [dir="rtl"] th.num{text-align:left; font-family:var(--mono);}
  [dir="rtl"] .panel .cap{justify-content:flex-start;}
  [dir="rtl"] .track i{left:auto; right:0;}
  [dir="rtl"] .word, [dir="rtl"] .login .word2, [dir="rtl"] .word em, [dir="rtl"] .login .word2 em{font-family:var(--disp);}

</style>
</head>
<body>
<div class="stage">
  <svg class="clock" viewBox="0 0 240 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M40 70 C40 40 90 34 118 42 C150 51 172 44 176 74 C182 118 150 128 150 150 C150 176 120 182 96 176 C60 168 60 150 54 120 C49 96 40 100 40 70 Z"
      fill="#6a5a44" stroke="#2a2118" stroke-width="1.2"/>
    <ellipse cx="108" cy="96" rx="52" ry="44" fill="#faf5e9" stroke="#2a2118" stroke-width="1.4"/>
    <path d="M108 96 L108 66 M108 96 L138 104" stroke="#2a2118" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M150 150 C150 174 146 190 138 196" stroke="#2a2118" stroke-width="1" opacity=".5"/>
  </svg>

  <header class="mast">
    <div>
      <div class="word">Audit<em>a</em></div>
      <div class="tag" data-i="tagline"></div>
    </div>
    <div class="mastright">
      <div id="userchip" class="userchip"></div>
      <nav class="lang">
        <button id="en" onclick="setLang('en')">EN</button>
        <span class="sep">/</span>
        <button id="ar" onclick="setLang('ar')">العربية</button>
      </nav>
    </div>
  </header>

  <main id="view"></main>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
let LANG='en';
let TOKEN=localStorage.getItem('audita_token')||'';
let USER=null;
let ENTRY_CACHE=[], AUDIT_CACHE=[], REVIEWS=new Set(), ACCOUNTS=[];
const RANK={viewer:0,staff:1,accountant:2,partner:3};
const can=min=>!!USER&&RANK[USER.role]>=RANK[min];
const api=async(p,o={})=>{
  const r=await fetch('/api'+p,{...o,headers:{'content-type':'application/json',...(TOKEN?{authorization:'Bearer '+TOKEN}:{}),...(o.headers||{})}});
  if(r.status===401){logout();throw new Error('401');}
  if(!r.ok)throw new Error((await r.json().catch(()=>({error:r.statusText}))).error);
  return r.json();
};
const COP=n=>'SAR '+Math.round(n).toLocaleString('en-US');

/* ---------- i18n ---------- */
const T={
  en:{
    tagline:'Books that are born audited.',
    consoleTitle:'The firm’s clients',
    consoleLead:'Every client keeps an isolated ledger. Ordered by risk. Select a name to open it.',
    cClient:'Client', cRisk:'Risk', cScore:'Score', cOpen:'Open findings', cEntries:'Entries',
    footConsole:'Served live from the firm ledger. Each book is structurally isolated.',
    back:'All clients',
    financials:'Financial statements', tax:'Tax position — ZATCA', findingsCap:'Continuous controls',
    revenue:'Revenue', expenses:'Expenses', profit:'Profit', assets:'Assets', liabilities:'Liabilities', equity:'Equity', balances:'Trial balance ties',
    ivaOut:'Output VAT', ivaIn:'Input VAT', ivaPay:'VAT payable', ivaCredit:'Credit balance', retFavor:'Withholdings in our favor', retPayable:'Withholdings we owe',
    trail:'Evidence trail', events:'events', chainValid:'chain intact', chainBroken:'chain broken',
    fId:'ID', fSev:'Severity', fRule:'Rule', fEntry:'Entry', fDesc:'Description', fStatus:'Status', fAct:'Action',
    clear:'Clear', escalate:'Escalate', none:'No findings.',
    footClient:'Changing a finding’s status is recorded in the immutable trail.',
    openF:n=>`${n} open finding${n===1?'':'s'}`, high:n=>`${n} high severity`, manual:p=>`${p}% manual / adjustment entries`, weekend:n=>`${n} weekend entr${n===1?'y':'ies'}`, quiet:'No material risk signals',
    band:{alto:'High',medio:'Medium',bajo:'Low'}, sev:{high:'High',medium:'Medium',low:'Low'},
    st:{open:'Open',reviewed:'Reviewed',cleared:'Cleared',escalated:'Escalated'},
    yes:'yes', dash:'—',
  },

function driverLines(factors){
  const T=t(); const out=[];
  if(factors.openFindings>0){let s=T.openF(factors.openFindings); if(factors.highFindings>0)s+=` (${T.high(factors.highFindings)})`; out.push(s);}
  const p=Math.round(factors.manualShare*100); if(p>0)out.push(T.manual(p));
  if(factors.weekendCount>0)out.push(T.weekend(factors.weekendCount));
  if(!out.length)out.push(T.quiet);
  return out;
}

  }catch(e){alert(e.message);}
}

}
function openList(id,rows){
  const T=t();
  if(!rows.length)return `<div class="none">${T.noOpen}</div>`;
  return `<table><thead><tr><th>${T.jSource}</th><th>${T.jRef}</th><th>${T.dueCol}</th><th class="num">${T.outCol}</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr>
    <td>${r.contactName}</td><td class="ref">${r.docNumber}</td>
    <td>${r.dueDate}${r.daysOverdue>0?` <span class="autotag" style="border-color:rgba(154,56,32,.4);color:var(--rust)">${r.daysOverdue}d ${T.overdueTag}</span>`:''}</td>
    <td class="num">${COP(r.outstanding)}</td>
    <td>${can('staff')?`<button class="act" onclick="payModal('${id}','${r.id}',${r.outstanding})">${T.payBtn}</button>`:''}</td>
  </tr>`).join('')}</tbody></table>`;
}
function arapPanel(id,ar,ap){
  const T=t();
  return `<div class="panel"><div class="cap">${T.arap}</div>
    <div class="grid" style="padding:16px 20px;gap:20px">
      <div><div class="ckhead">${T.receivables}</div>${agingMini(ar)}${openList(id,ar.rows)}</div>
      <div><div class="ckhead">${T.payables}</div>${agingMini(ap)}${openList(id,ap.rows)}</div>
    </div></div>`;
}
async function billModal(id){
  await ensureAccounts();const T=t();
  const opts=ACCOUNTS.filter(a=>a.type==='expense'||a.type==='cogs'||a.type==='asset').map(a=>`<option value="${a.code}">${a.code} · ${acctLbl(a)}</option>`).join('');
  openModal(`<div class="mh">${T.newBill}<button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="two"><div class="field"><label>${T.vendor}</label><input id="b_name" value=""></div>
        <div class="field"><label>NIT</label><input id="b_nit" value=""></div></div>
      <div class="two"><div class="field"><label>${T.date}</label><input id="b_date" type="date" value="2026-06-15"></div>
        <div class="field"><label>${T.expenseAcct}</label><select id="b_acct">${opts}</select></div></div>
      <div class="field"><label>${T.base}</label><input id="b_base" type="number" min="0" value="1000000"></div>
      <div class="cufe" id="b_prev"></div>
    </div>
    <div class="mf"><button class="btn ink" onclick="closeModal()">${T.cancel}</button><button class="btn" onclick="submitBill('${id}')">${T.createBill}</button></div>`);
  modal.addEventListener('input',billPreview);billPreview();
}
function billPreview(){const el=document.getElementById('b_prev');if(!el)return;const b=+document.getElementById('b_base').value||0;const iva=Math.round(b*0.19),rete=Math.round(b*0.025);el.innerHTML=`IVA ${COP(iva)} · Retefuente −${COP(rete)} · ${t().payables.split('—')[0].trim()}: ${COP(b+iva-rete)}`;}
async function submitBill(id){
  const T=t();
  try{await api(`/clients/${id}/bills`,{method:'POST',body:JSON.stringify({vendorName:document.getElementById('b_name').value||'—',vendorNit:document.getElementById('b_nit').value,date:document.getElementById('b_date').value,base:+document.getElementById('b_base').value||0,expenseAccount:document.getElementById('b_acct').value})});
    closeModal();toast(T.okBill);clientView(id);}catch(e){alert(e.message);}
}
function payModal(id,itemId,outstanding){
  const T=t();
  openModal(`<div class="mh">${T.payTitle}<button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">
      <div class="two"><div class="field"><label>${T.payAmount}</label><input id="p_amt" type="number" min="0" value="${outstanding}"></div>
        <div class="field"><label>${T.date}</label><input id="p_date" type="date" value="2026-06-25"></div></div>
    </div>
    <div class="mf"><button class="btn ink" onclick="closeModal()">${T.cancel}</button><button class="btn" onclick="submitPayment('${id}','${itemId}')">${T.payBtn}</button></div>`);
}
async function submitPayment(id,itemId){
  const T=t();
  try{await api(`/clients/${id}/payments`,{method:'POST',body:JSON.stringify({openItemId:itemId,amount:+document.getElementById('p_amt').value||0,date:document.getElementById('p_date').value})});
    closeModal();toast(T.okPay);clientView(id);}catch(e){alert(e.message);}
}
window.arapPanel=arapPanel;window.billModal=billModal;window.submitBill=submitBill;window.payModal=payModal;window.submitPayment=submitPayment;window.billPreview=billPreview;window.agingMini=agingMini;window.openList=openList;

/* ---------- period lock ---------- */
async function togglePeriod(id,action){
  const T=t();
  try{await api(`/clients/${id}/periods/2026-06/${action}`,{method:'POST'});toast(action==='lock'?T.okLock:T.okUnlock);clientView(id);}catch(e){alert(e.message);}
}
window.togglePeriod=togglePeriod;

/* ---------- opening balances (migration) ---------- */
function openingModal(id){
  const T=t();
  const sample=`111005,60000000,0\n143505,18000000,0\n310505,0,78000000`;
  openModal(`<div class="mh">${T.openingBal}<button class="x" onclick="closeModal()">×</button></div>
    <div class="mb">
      <p class="lead" style="margin-top:0">${T.obHint}</p>
      <div class="two"><div class="field"><label>${T.date}</label><input id="ob_date" type="date" value="2026-01-01"></div><div></div></div>
      <textarea id="ob_csv" style="width:100%;height:120px;font-family:ui-monospace,monospace;font-size:12px;border:1px solid var(--line);border-radius:3px;padding:10px;background:#fffdf8">${sample}</textarea>
    </div>
    <div class="mf"><button class="btn ink" onclick="closeModal()">${T.cancel}</button><button class="btn" onclick="submitOpening('${id}')">${T.importBtn}</button></div>`);
}
async function submitOpening(id){
  const T=t();
  const lines=document.getElementById('ob_csv').value.split(/\r?\n/).map(r=>r.trim()).filter(Boolean).map(r=>{const [acc,d,c]=r.split(',');return {accountCode:(acc||'').trim(),debit:+d||undefined,credit:+c||undefined};});
  try{await api(`/clients/${id}/opening-balances`,{method:'POST',body:JSON.stringify({date:document.getElementById('ob_date').value,lines})});closeModal();toast(T.okOpening);clientView(id);}
  catch(e){alert(e.message);}
}
window.openingModal=openingModal;window.submitOpening=submitOpening;

function setLang(l){
  LANG=l; document.documentElement.lang=l; document.documentElement.dir=(l==='ar'?'rtl':'ltr');
  document.getElementById('en').classList.toggle('on',l==='en');
  document.getElementById('ar').classList.toggle('on',l==='ar');
  document.querySelector('[data-i="tagline"]').textContent=t().tagline;
  setUserChip(); route();
}
function route(){
  if(!USER){loginView();return;}
  (CURRENT.page==='client'?clientView(CURRENT.id):consoleView());
}
function setUserChip(){
  const el=document.getElementById('userchip');
  el.innerHTML = USER? `<span class="who">${USER.name}</span><span class="role">${USER.role}</span><a onclick="logout()">${t().logout}</a>` : '';
}

/* ---------- login ---------- */
function loginView(){
  const T=t();const DEMO=[['ana@audita.co','partner'],['carlos@audita.co','accountant'],['sofia@audita.co','staff'],['cliente@andina.co','viewer']];
  view.innerHTML=`<div class="login">
    <div class="word2">Audit<em>a</em></div><div class="sub2">${T.tagline}</div>
    <div class="panel"><div class="bd" style="padding:20px 22px">
      <div class="field"><label>${T.email}</label><input id="lg_email" value="ana@audita.co"></div>
      <div class="field"><label>${T.password}</label><input id="lg_pass" type="password" value="audita" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn" style="width:100%;justify-content:center" onclick="doLogin()">${T.signin}</button>
      <div class="loginerr" id="lg_err"></div>
      <div class="lead" style="margin:6px 0 6px">${T.quick}</div>
      <div class="quick">${DEMO.map(([e,r])=>`<button onclick="doLogin('${e}')"><span>${e}</span><span class="r">${r}</span></button>`).join('')}</div>
    </div></div></div>`;
}
async function doLogin(email){
  const T=t();
  const em=email||document.getElementById('lg_email').value;
  const pw=email?'audita':document.getElementById('lg_pass').value;
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:em,password:pw})});
    if(!r.ok)throw new Error();
    const data=await r.json();
    TOKEN=data.token; USER=data.user; localStorage.setItem('audita_token',TOKEN);
    CURRENT={page:'console',id:null}; setUserChip(); consoleView();
  }catch(e){const el=document.getElementById('lg_err');if(el)el.textContent=T.badLogin;}
}
function logout(){TOKEN='';USER=null;localStorage.removeItem('audita_token');CURRENT={page:'console',id:null};setUserChip();loginView();}
window.doLogin=doLogin;window.logout=logout;
window.setLang=setLang;window.consoleView=consoleView;window.clientView=clientView;window.setStatus=setStatus;
window.modalEntry=modalEntry;window.modalInvoice=modalInvoice;window.addLine=addLine;window.submitEntry=submitEntry;window.submitInvoice=submitInvoice;window.showEntry=showEntry;window.closeModal=closeModal;

async function boot(){
  if(TOKEN){ try{ USER=await api('/me'); }catch{ USER=null; TOKEN=''; localStorage.removeItem('audita_token'); } }
  setLang('en');
}
boot();
</script>
</body>
